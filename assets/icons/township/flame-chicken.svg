<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="township-icon township-chicken">
  <defs>
    <!-- Authentic Hand-Painted Mural & Wall Plaster Brush Filter -->
    <filter id="mural-roughness" x="-15%" y="-15%" width="130%" height="130%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    </filter>

    <filter id="paint-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="grain" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.15 0" result="fadedGrain" />
      <feComposite in="SourceGraphic" in2="fadedGrain" operator="over" />
    </filter>
  </defs>

  <!-- Group with Authentic Painted Brush Filter Applied -->
  <g filter="url(#mural-roughness)">
    
    <!-- Painted Wall Plaster Cast Shadow (Heavy signwriter drop-shadow) -->
    <g opacity="0.45" transform="translate(5, 6)">
      <!-- Coal embers shadow -->
      <path d="M22 134 Q40 148 80 148 Q120 148 138 134 Q146 122 132 116 Q108 126 80 126 Q52 126 28 116 Q14 122 22 134 Z" fill="#120e0a"/>
      <!-- Chicken & Flame silhouette shadow -->
      <path d="M34 116 C24 96 28 78 36 64 C42 54 52 46 64 42 C72 26 88 26 96 42 C108 46 118 54 124 64 C132 78 136 96 126 116 C108 126 52 126 34 116 Z" fill="#120e0a"/>
      <path d="M120 78 C136 70 144 56 142 42 C134 38 122 48 118 60 Z" fill="#120e0a"/>
      <path d="M40 78 C24 70 16 56 18 42 C26 38 38 48 42 60 Z" fill="#120e0a"/>
    </g>

    <!-- Glowing Braai Charcoal Embers & Flames (Under Chicken) -->
    <g class="braai-fire">
      <!-- Dark Charred Coals Base -->
      <path d="M24 130 C38 144 76 146 80 146 C84 146 122 144 136 130 C144 120 134 114 120 120 C100 126 60 126 40 120 C26 114 16 120 24 130 Z" 
            fill="#1e1815" stroke="#120e0a" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Red-Hot Glowing Coal Fissures -->
      <path d="M36 130 Q54 138 72 132 Q92 138 114 128 Q124 134 122 138 Q100 144 80 144 Q60 144 38 138 Z" fill="#dc2626"/>
      <path d="M48 134 Q64 140 80 138 Q96 140 110 132" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
      <circle cx="62" cy="135" r="3.5" fill="#facc15"/>
      <circle cx="94" cy="134" r="3" fill="#facc15"/>
      <circle cx="78" cy="138" r="2.5" fill="#fff"/>

      <!-- Raw Hand-Painted Leaping Flame Tongues -->
      <path d="M28 116 C22 98 34 88 40 98 C46 80 60 72 64 86 C72 66 88 74 90 92 C100 84 112 94 110 112 C120 98 134 108 130 122 C116 130 44 130 28 116 Z" 
            fill="#ea580c" stroke="#120e0a" stroke-width="4" stroke-linejoin="round"/>
      
      <!-- Inner Saturated Yellow/Gold Fire Core -->
      <path d="M38 118 C34 106 42 98 48 106 C52 92 64 88 68 100 C76 86 86 92 88 106 C96 100 106 108 102 118 C88 126 50 126 38 118 Z" 
            fill="#facc15" stroke="#120e0a" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Hand-Painted White Fire Dabs -->
      <path d="M54 106 Q58 98 62 108" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M78 102 Q82 96 86 104" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Whole Spatchcock Flame-Grilled Chicken Body (Splayed on Braai) -->
    <g class="chicken-meat">
      <!-- Main Roasted Body Mass (Splayed plump chicken) -->
      <path d="M34 110 C24 94 28 72 38 56 C46 44 60 38 72 36 C76 30 84 30 88 36 C100 38 114 44 122 56 C132 72 136 94 126 110 C114 122 46 122 34 110 Z" 
            fill="#d97706" stroke="#120e0a" stroke-width="5" stroke-linejoin="round"/>
      
      <!-- Deep Golden/Crispy Skin Underpainting -->
      <path d="M42 106 C34 94 36 76 46 62 C54 50 66 44 80 44 C94 44 106 50 114 62 C124 76 126 94 118 106 C108 116 52 116 42 106 Z" 
            fill="#f59e0b"/>
      
      <!-- Tender White/Cream Breast Meat Split (Traditional braai flattie cut) -->
      <path d="M76 44 C72 60 68 84 74 104 C78 104 82 104 86 104 C92 84 88 60 84 44 Z" 
            fill="#ea580c" stroke="#120e0a" stroke-width="3"/>
      <path d="M78 48 C76 64 74 80 78 96" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>

      <!-- Left Drumstick & Thigh (Juicy, basted, splayed out) -->
      <path d="M38 74 C24 66 14 52 18 38 C22 34 28 34 32 40 C34 44 32 50 28 52 C36 58 44 62 48 70 Z" 
            fill="#b45309" stroke="#120e0a" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Left Knuckle Bone -->
      <path d="M18 38 C14 36 12 30 16 28 C20 26 24 30 22 34 C26 32 30 36 28 40 Z" 
            fill="#fefefe" stroke="#120e0a" stroke-width="3.2" stroke-linejoin="round"/>

      <!-- Right Drumstick & Thigh (Splayed out) -->
      <path d="M122 74 C136 66 146 52 142 38 C138 34 132 34 128 40 C126 44 128 50 132 52 C124 58 116 62 112 70 Z" 
            fill="#b45309" stroke="#120e0a" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Right Knuckle Bone -->
      <path d="M142 38 C146 36 148 30 144 28 C140 26 136 30 138 34 C134 32 130 36 132 40 Z" 
            fill="#fefefe" stroke="#120e0a" stroke-width="3.2" stroke-linejoin="round"/>

      <!-- Left Wing Plump Joint -->
      <path d="M42 82 C32 86 28 98 34 106 C40 112 50 108 52 98 Z" 
            fill="#b45309" stroke="#120e0a" stroke-width="4" stroke-linejoin="round"/>

      <!-- Right Wing Plump Joint -->
      <path d="M118 82 C128 86 132 98 126 106 C120 112 110 108 108 98 Z" 
            fill="#b45309" stroke="#120e0a" stroke-width="4" stroke-linejoin="round"/>

      <!-- Thick Red Peri-Peri / BBQ Basting Glaze Pools -->
      <path d="M52 64 C60 56 70 54 78 58 C68 66 58 72 52 64 Z" fill="#991b1b"/>
      <path d="M108 64 C100 56 90 54 82 58 C92 66 102 72 108 64 Z" fill="#991b1b"/>
      <path d="M58 88 C66 78 76 78 78 88 C70 94 62 94 58 88 Z" fill="#b91c1c"/>
      <path d="M102 88 C94 78 84 78 82 88 C90 94 98 94 102 88 Z" fill="#b91c1c"/>

      <!-- Searing Braai Grid Char Marks (Blackened heavy iron grid lines) -->
      <g stroke="#181008" stroke-width="4.5" stroke-linecap="round">
        <line x1="50" y1="52" x2="68" y2="74"/>
        <line x1="66" y1="46" x2="90" y2="76"/>
        <line x1="92" y1="48" x2="110" y2="72"/>
        <line x1="48" y1="78" x2="72" y2="104"/>
        <line x1="88" y1="78" x2="112" y2="104"/>
      </g>
      <!-- Cross-Hatch Braai Sizzle Lines -->
      <g stroke="#181008" stroke-width="3.5" stroke-linecap="round">
        <line x1="68" y1="52" x2="48" y2="72"/>
        <line x1="92" y1="48" x2="68" y2="76"/>
        <line x1="112" y1="54" x2="90" y2="78"/>
        <line x1="72" y1="80" x2="52" y2="102"/>
        <line x1="108" y1="80" x2="88" y2="102"/>
      </g>

      <!-- Blistered Char Marks / Burnt Bubble Spots (True Braai Realism) -->
      <circle cx="56" cy="62" r="3" fill="#181008"/>
      <circle cx="104" cy="64" r="3.2" fill="#181008"/>
      <circle cx="68" cy="82" r="2.8" fill="#181008"/>
      <circle cx="92" cy="84" r="3" fill="#181008"/>
      <circle cx="80" cy="98" r="3.5" fill="#181008"/>

      <!-- Authentic Signwriter Gouache Highlights (White & Yellow Brush Dabs) -->
      <!-- Top crest highlight -->
      <path d="M56 46 Q68 40 80 42 Q92 40 104 46" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
      <!-- Drumstick glints -->
      <path d="M26 44 Q32 48 36 54" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M134 44 Q128 48 124 54" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
      <!-- Belly glistening glaze streaks -->
      <path d="M54 74 Q60 70 66 74" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M94 74 Q100 70 106 74" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M64 96 Q72 92 76 96" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M84 96 Q88 92 96 96" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <!-- White shine stars -->
      <circle cx="48" cy="50" r="2" fill="#ffffff"/>
      <circle cx="112" cy="50" r="2" fill="#ffffff"/>
    </g>

    <!-- Hot Braai Smoke & Rising Aromas (Township Street Sizzle) -->
    <g stroke="#120e0a" stroke-width="3" stroke-linecap="round" fill="none">
      <!-- White smoke core with black contour -->
      <path d="M52 34 C44 22 56 14 50 4" stroke="#f3f4f6" stroke-width="4.5"/>
      <path d="M52 34 C44 22 56 14 50 4"/>
      <path d="M80 28 C74 18 84 12 78 2" stroke="#f3f4f6" stroke-width="5"/>
      <path d="M80 28 C74 18 84 12 78 2"/>
      <path d="M108 34 C116 22 104 14 110 4" stroke="#f3f4f6" stroke-width="4.5"/>
      <path d="M108 34 C116 22 104 14 110 4"/>
    </g>

    <!-- Flying Embers & Fire Sparks -->
    <circle cx="18" cy="94" r="3" fill="#facc15" stroke="#120e0a" stroke-width="1.5"/>
    <circle cx="142" cy="92" r="3.2" fill="#ea580c" stroke="#120e0a" stroke-width="1.5"/>
    <circle cx="132" cy="24" r="2.5" fill="#facc15" stroke="#120e0a" stroke-width="1.2"/>
    <circle cx="28" cy="24" r="2.5" fill="#ea580c" stroke="#120e0a" stroke-width="1.2"/>
  </g>
</svg>
