<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="township-icon township-chilli">
  <defs>
    <filter id="mural-roughness-chilli" x="-15%" y="-15%" width="130%" height="130%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    </filter>
  </defs>

  <g filter="url(#mural-roughness-chilli)">
    <!-- Painted Wall Cast Shadow -->
    <g opacity="0.45" transform="translate(5, 6)">
      <path d="M54 136 C32 118 34 88 48 70 C54 52 70 38 80 16 C92 38 112 46 114 70 C126 84 126 114 108 136 C90 148 68 146 54 136 Z" fill="#120e0a"/>
      <path d="M44 116 C44 134 62 150 80 150 Q106 150 118 116 Q118 78 92 44 Q86 64 68 94 Q44 116 44 116 Z" fill="#120e0a"/>
    </g>

    <!-- Roaring Braai Fire Backdrop -->
    <g class="peri-flames">
      <!-- Outer Jagged Orange-Red Flame -->
      <path d="M52 134 C30 116 32 86 46 68 C52 50 68 36 80 16 C92 36 110 44 114 68 C124 84 124 112 108 134 C88 146 68 144 52 134 Z" 
            fill="#ea580c" stroke="#120e0a" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Inner Bright Yellow Fire Tongue -->
      <path d="M60 130 C44 116 48 94 58 82 C64 68 74 54 80 34 C88 52 100 62 102 78 C108 92 106 112 96 128 C86 138 70 138 60 130 Z" 
            fill="#facc15" stroke="#120e0a" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- White Hot Flame Dabs -->
      <path d="M72 120 C68 106 72 94 78 84 C82 76 84 70 82 66 C86 74 90 82 88 92 C88 104 84 114 72 120 Z" 
            fill="#fffbeb" opacity="0.95"/>
    </g>

    <!-- Fiery African Bird's Eye Chilli Pepper (Curved, raw, potent) -->
    <g class="chilli-pod">
      <!-- Main Deep Red Chilli Body -->
      <path d="M46 112 C44 130 62 146 80 146 C104 146 120 116 116 80 C114 58 102 44 90 38 C84 60 66 90 46 112 Z" 
            fill="#dc2626" stroke="#120e0a" stroke-width="5" stroke-linejoin="round"/>
      
      <!-- Deep Crimson Shadow Underbelly -->
      <path d="M48 112 C50 128 62 142 80 142 C90 142 96 136 94 128 C78 128 62 120 54 108 Z" fill="#991b1b"/>

      <!-- Saturated Vermilion Highlighting Curve -->
      <path d="M68 62 C78 72 96 86 102 110 C106 122 102 134 98 138 C108 126 112 106 108 78 C102 60 94 48 90 42 C88 48 78 56 68 62 Z" fill="#ef4444"/>

      <!-- Fresh Green Calyx Crown (Leafy Star Base) -->
      <path d="M84 36 C80 44 76 48 72 50 C78 52 84 54 88 48 C94 54 100 54 106 48 C102 46 98 42 94 36 Z" 
            fill="#16a34a" stroke="#120e0a" stroke-width="3.5" stroke-linejoin="round"/>
      
      <!-- Curved Fresh Calyx Stem (Tough green stalk) -->
      <path d="M90 36 C90 26 96 18 108 12 C110 11 112 13 110 15 C102 20 98 28 96 36 Z" 
            fill="#22c55e" stroke="#120e0a" stroke-width="3" stroke-linejoin="round"/>

      <!-- Sign-Painter White Gouache Curved Highlight -->
      <path d="M78 64 Q94 78 96 114" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
      <ellipse cx="80" cy="62" rx="2.5" ry="5" transform="rotate(-30 80 62)" fill="#ffffff"/>
      <circle cx="94" cy="122" r="2.2" fill="#ffffff"/>
    </g>

    <!-- Painted "HOT!" Sign Burst Text (Direct Township Signwriting Touch) -->
    <g class="hot-burst" transform="translate(14, 30)">
      <path d="M8 8 L18 0 L24 8 L34 2 L34 14 L44 14 L38 24 L46 32 L34 32 L30 42 L22 34 L12 40 L12 28 L0 26 L8 18 Z" 
            fill="#facc15" stroke="#120e0a" stroke-width="3" stroke-linejoin="round"/>
      <text x="8" y="27" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#dc2626" stroke="#120e0a" stroke-width="1.2">HOT!</text>
    </g>

    <!-- Flying Spicy Sparks & Embers -->
    <circle cx="36" cy="78" r="3.5" fill="#facc15" stroke="#120e0a" stroke-width="1.5"/>
    <circle cx="126" cy="62" r="3" fill="#ea580c" stroke="#120e0a" stroke-width="1.5"/>
    <circle cx="118" cy="98" r="3.5" fill="#facc15" stroke="#120e0a" stroke-width="1.5"/>
    <circle cx="120" cy="30" r="2.5" fill="#ea580c"/>
  </g>
</svg>
