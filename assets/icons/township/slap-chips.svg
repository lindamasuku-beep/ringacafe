<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" class="township-icon township-chips">
  <!-- Hand-Painted Shadow Layer -->
  <g class="painted-shadow" opacity="0.35" transform="translate(3.5, 4.5)">
    <path d="M36 104 L26 56 L94 56 L84 104 Z" fill="#18130f"/>
    <!-- Overflowing chips silhouette shadow -->
    <path d="M24 56 C24 38 42 28 60 28 C78 28 96 38 96 56 Z" fill="#18130f"/>
  </g>

  <!-- Golden Slap Chips (Overflowing crispy thick-cut fries) -->
  <g class="chips-pile">
    <!-- Background Chips -->
    <rect x="36" y="26" width="10" height="38" rx="3" transform="rotate(-15 36 26)" fill="#d97706" stroke="#18130f" stroke-width="3"/>
    <rect x="74" y="24" width="10" height="40" rx="3" transform="rotate(18 74 24)" fill="#d97706" stroke="#18130f" stroke-width="3"/>
    <rect x="48" y="20" width="11" height="42" rx="3" transform="rotate(-5 48 20)" fill="#f59e0b" stroke="#18130f" stroke-width="3.2"/>
    <rect x="62" y="20" width="11" height="44" rx="3" transform="rotate(6 62 20)" fill="#fbbf24" stroke="#18130f" stroke-width="3.2"/>

    <!-- Foreground Criss-Crossing Chips -->
    <rect x="28" y="38" width="10" height="34" rx="3" transform="rotate(-28 28 38)" fill="#fbbf24" stroke="#18130f" stroke-width="3"/>
    <rect x="42" y="32" width="11" height="36" rx="3" transform="rotate(8 42 32)" fill="#fde047" stroke="#18130f" stroke-width="3.2"/>
    <rect x="58" y="34" width="10" height="38" rx="3" transform="rotate(-12 58 34)" fill="#f59e0b" stroke="#18130f" stroke-width="3.2"/>
    <rect x="72" y="36" width="11" height="35" rx="3" transform="rotate(22 72 36)" fill="#fde047" stroke="#18130f" stroke-width="3"/>
    
    <!-- Red Paprika Braai Seasoning Flecks -->
    <circle cx="44" cy="36" r="1.5" fill="#dc2626"/>
    <circle cx="52" cy="28" r="1.5" fill="#dc2626"/>
    <circle cx="66" cy="30" r="1.5" fill="#dc2626"/>
    <circle cx="76" cy="42" r="1.5" fill="#dc2626"/>
    <circle cx="60" cy="44" r="1.5" fill="#dc2626"/>
    <circle cx="34" cy="48" r="1.5" fill="#dc2626"/>

    <!-- White Sign-Painter Gloss Highlights on crispy chip edges -->
    <path d="M49 22 L51 38" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M63 22 L65 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M43 34 L45 48" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Classic Painted Chip Box / Cone (Painted in Townshop Rose Pink / Coral from Ref 1 & 2) -->
  <g class="chip-container">
    <!-- Main Box Body -->
    <path d="M34 102 L24 54 L96 54 L86 102 Z" 
          fill="#ea580c" stroke="#18130f" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Curved Scoop Front Lip -->
    <path d="M24 54 C40 64 80 64 96 54 L86 102 L34 102 Z" fill="#f97316"/>
    <path d="M24 54 C40 64 80 64 96 54" stroke="#18130f" stroke-width="3.5" fill="none"/>

    <!-- Sign-Writer Painted Star & Stripe Graphic (Township Barber/Cafe motif) -->
    <!-- Cream White Center Badge Plaque -->
    <ellipse cx="60" cy="78" rx="20" ry="14" fill="#fef3c7" stroke="#18130f" stroke-width="2.5"/>
    <!-- Red Fire Emblem in Badge -->
    <path d="M60 70 C56 74 54 78 57 82 C60 86 64 84 64 81 C64 83 67 84 66 81 C68 83 69 80 67 76 C65 72 61 70 60 70 Z" 
          fill="#dc2626" stroke="#18130f" stroke-width="1.5"/>

    <!-- Bottom rim of box -->
    <path d="M34 102 L86 102" stroke="#18130f" stroke-width="4" stroke-linecap="round"/>
    <!-- Box gloss white streak -->
    <path d="M28 58 L36 96" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Steam Ribbons -->
  <g class="steam" stroke="#18130f" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M46 18 C42 12 48 8 46 4" stroke="#e5e7eb" stroke-width="2.8"/>
    <path d="M46 18 C42 12 48 8 46 4"/>
    <path d="M68 18 C72 12 66 8 70 4" stroke="#e5e7eb" stroke-width="2.8"/>
    <path d="M68 18 C72 12 66 8 70 4"/>
  </g>
</svg>
