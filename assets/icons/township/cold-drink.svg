<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" class="township-icon township-drink">
  <!-- Hand-Painted Shadow Layer (Directly inspired by Ref 3 cosmetic bottles) -->
  <g class="painted-shadow" opacity="0.35" transform="translate(3.5, 4.5)">
    <!-- Base Ellipse Shadow -->
    <ellipse cx="60" cy="104" rx="26" ry="8" fill="#18130f"/>
    <!-- Bottle silhouette shadow -->
    <path d="M48 102 L48 56 C48 46 54 36 54 22 L66 22 C66 36 72 46 72 56 L72 102 Z" fill="#18130f"/>
    <rect x="52" y="14" width="16" height="8" rx="2" fill="#18130f"/>
  </g>

  <!-- Bottle Body Shape (Classic Glass Soda / Cold 1.5L Bottle) -->
  <g class="bottle-body">
    <!-- Main Bottle Glass Fill (Deep rich amber/cola red or chrome yellow with sign paint look) -->
    <path d="M48 102 L48 54 C48 44 54 36 54 22 L66 22 C66 36 72 44 72 54 L72 102 C72 106 48 106 48 102 Z" 
          fill="#b91c1c" stroke="#18130f" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Rich dark carbonated soda fill (Cola black-red) -->
    <path d="M50 100 L50 48 C52 46 56 42 56 32 L64 32 C64 42 68 46 70 48 L70 100 C68 103 52 103 50 100 Z" fill="#7f1d1d"/>

    <!-- Bottle Crown Cap (Cerulean blue cap like in Ref 3) -->
    <rect x="52" y="14" width="16" height="8" rx="2" fill="#0284c7" stroke="#18130f" stroke-width="3"/>
    <path d="M52 20 C54 22 66 22 68 20" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Fluted bottle neck ring -->
    <rect x="53" y="24" width="14" height="4" rx="1.5" fill="#991b1b" stroke="#18130f" stroke-width="2"/>

    <!-- Sign-Painted Bottle Label (Cerulean Blue & White, as seen in Ref 3!) -->
    <g class="bottle-label">
      <!-- Blue Label Band -->
      <rect x="47" y="56" width="26" height="30" rx="3" fill="#0284c7" stroke="#18130f" stroke-width="3"/>
      <!-- Inner White Banner -->
      <rect x="49" y="62" width="22" height="18" fill="#fefefe" stroke="#18130f" stroke-width="1.8"/>
      <!-- Red Star / Flame on label -->
      <path d="M60 66 L62 70 L66 71 L63 74 L64 78 L60 76 L56 78 L57 74 L54 71 L58 70 Z" fill="#dc2626"/>
      <!-- Label Gold borders -->
      <line x1="49" y1="59" x2="71" y2="59" stroke="#fbc02d" stroke-width="1.5"/>
      <line x1="49" y1="83" x2="71" y2="83" stroke="#fbc02d" stroke-width="1.5"/>
    </g>

    <!-- Signwriter Painted White Gouache Reflection Glints (The key Ref 3 signature!) -->
    <!-- Left vertical bottle glass shine -->
    <path d="M52 38 L52 50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M51 60 L51 86" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <path d="M51 90 L51 98" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Right subtle edge glint -->
    <path d="M69 60 L69 86" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Ice Chill / Cold Condensation Droplets (Ice Cold!) -->
  <g class="chill-bubbles">
    <!-- Cold splash / frost lines -->
    <path d="M40 32 L34 26" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M80 32 L86 26" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 50 L28 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M84 50 L92 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Condensation beads on glass -->
    <circle cx="44" cy="48" r="1.5" fill="#38bdf8"/>
    <circle cx="76" cy="46" r="1.5" fill="#38bdf8"/>
    <circle cx="75" cy="94" r="1.8" fill="#38bdf8"/>
    <circle cx="45" cy="92" r="1.8" fill="#38bdf8"/>
  </g>
</svg>
