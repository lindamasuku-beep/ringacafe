<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="township-icon township-fire">
  <defs>
    <filter id="mural-roughness-fire" x="-15%" y="-15%" width="130%" height="130%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    </filter>
  </defs>

  <g filter="url(#mural-roughness-fire)">
    <!-- Painted Wall Cast Shadow -->
    <g opacity="0.45" transform="translate(5, 6)">
      <ellipse cx="80" cy="136" rx="58" ry="16" fill="#120e0a"/>
      <path d="M80 18 C80 18 102 46 102 70 C102 78 100 86 96 92 C102 86 112 90 118 100 C126 116 116 136 92 138 C62 140 38 120 42 94 C46 80 56 74 62 78 C58 64 64 50 80 18 Z" fill="#120e0a"/>
    </g>

    <!-- Glowing Charcoal Briquettes Bed -->
    <g class="coals-bed">
      <ellipse cx="80" cy="132" rx="56" ry="15" fill="#1c1815" stroke="#120e0a" stroke-width="4.5"/>
      <ellipse cx="52" cy="132" rx="18" ry="9" fill="#292524" stroke="#120e0a" stroke-width="2.5"/>
      <ellipse cx="106" cy="132" rx="20" ry="9" fill="#292524" stroke="#120e0a" stroke-width="2.5"/>
      <ellipse cx="78" cy="134" rx="22" ry="10" fill="#1f1f1f" stroke="#120e0a" stroke-width="2.5"/>

      <!-- Glowing Red & Orange Fissures -->
      <path d="M38 132 Q48 128 62 130 Q74 134 94 130" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M68 136 Q80 131 92 132 Q108 131 116 132" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="76" cy="133" r="3.5" fill="#facc15"/>
      <circle cx="94" cy="132" r="2.8" fill="#facc15"/>
    </g>

    <!-- Raw Hand-Painted Leaping Braai Flames -->
    <g class="flame-body">
      <!-- Outer Crimson / Vermilion Flame -->
      <path d="M80 18 C80 18 100 46 100 70 C100 78 96 84 92 90 C100 84 110 88 114 98 C122 112 112 132 92 134 C64 136 42 118 46 94 C48 80 56 74 62 78 C58 64 64 50 80 18 Z" 
            fill="#ea580c" stroke="#120e0a" stroke-width="5" stroke-linejoin="round"/>
      
      <!-- Saturated Bright Orange Middle Flame -->
      <path d="M80 36 C80 36 94 54 94 74 C94 82 90 88 86 92 C92 90 100 92 102 100 C106 112 98 126 84 128 C64 130 52 116 54 100 C56 90 62 84 66 88 C64 78 70 60 80 36 Z" 
            fill="#f97316" stroke="#120e0a" stroke-width="3.8" stroke-linejoin="round"/>

      <!-- Inner Bright Yellow Fire Core -->
      <path d="M80 58 C80 58 88 72 88 86 C88 94 84 100 80 102 C82 102 88 104 90 110 C92 118 84 124 74 124 C62 124 58 114 62 104 C64 96 68 92 70 96 C70 88 72 72 80 58 Z" 
            fill="#facc15" stroke="#120e0a" stroke-width="3" stroke-linejoin="round"/>

      <!-- White-Hot Pure Energy Core -->
      <ellipse cx="76" cy="112" rx="7" ry="10" fill="#fffbeb"/>
      <ellipse cx="76" cy="112" rx="4" ry="6" fill="#ffffff"/>
    </g>

    <!-- Signwriter White Brush Gouache Highlights -->
    <g class="flame-highlights">
      <path d="M76 32 Q72 48 64 64 Q58 80 56 94" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M94 58 Q98 68 96 78 Q92 86 88 92" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- Floating Hot Embers & Sparks -->
    <circle cx="80" cy="8" r="3.5" fill="#facc15" stroke="#120e0a" stroke-width="1.2"/>
    <circle cx="106" cy="34" r="3.2" fill="#ea580c" stroke="#120e0a" stroke-width="1.2"/>
    <circle cx="118" cy="52" r="2.8" fill="#f59e0b"/>
    <circle cx="44" cy="48" r="3" fill="#facc15" stroke="#120e0a" stroke-width="1.2"/>
    <circle cx="34" cy="70" r="2.5" fill="#dc2626"/>
  </g>
</svg>
